name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - uses: actions/checkout@v4

      - name: Get latest version
        id: version
        run: |
          LATEST_APP=$(wget -qO- https://api.github.com/repos/usememos/memos/tags | gawk -F '["v]' '/name/{print "v"$5;exit}')
          echo "version=${LATEST_APP}" >> "$GITHUB_OUTPUT"

      - name: Clone Repo
        run: git clone -b ${{ steps.version.outputs.version }} https://github.com/usememos/memos

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true
          cache: true
          cache-dependency-path: memos/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: memos/web/pnpm-lock.yaml

      - name: Build Frontend
        working-directory: memos/web
        run: |
          pnpm install --frozen-lockfile
          pnpm release

      - name: Build binary
        working-directory: memos
        env:
          GOOS: freebsd
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build -trimpath \
            -ldflags="-s -w -X github.com/usememos/memos/internal/version.Version=${{ steps.version.outputs.version }}" \
            -tags netgo,osusergo \
            -o memos ./cmd/memos

      - name: Package binary
        working-directory: memos
        run: |
          mkdir -p artifact
          cp memos artifact/memos
          tar -czvf memos-freebsd-amd64.tar.gz -C artifact memos

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: memos-pre-built
          path: |
            memos/memos-freebsd-amd64.tar.gz

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: |
            memos/memos-freebsd-amd64.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 8
